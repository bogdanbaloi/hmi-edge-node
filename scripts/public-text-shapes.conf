# The shapes this repo refuses in public text. Data, not code.
#
# WHY THIS FILE EXISTS. The same house rule is enforced by three checkers on
# this machine: stil.py over Romanian sheets, rule 7 of bash-guard over commit
# subjects, and this repo's check-public-text.sh over commits plus pull request
# text. On 2026-09-25 no two of them banned the same set, and the en dash was
# missing from THIS one, so the local guard refused a shape while this CI job
# accepted it afterwards. Two gates disagreeing about one line of text.
#
# The shared source is ~/.claude/hooks/public-text-shapes.conf, which stil.py
# and the guard both read. This CI job runs on a GitHub runner and cannot read
# that machine, so this repo keeps its own copy ON PURPOSE. It exists as DATA
# rather than as a pattern inside the script so the two lists can be compared
# without anybody parsing anybody's code, which was hub's condition and a fair
# one: a fact derived from code breaks at the first refactor.
#
# FORMAT:  id | contexts | "literal" | label
# Contexts: ro for Romanian prose, en for English commit subjects. Every entry
# is a plain literal. The script escapes them before use, so nothing here is a
# regular expression and nothing needs quoting twice.
#
# ROWS THIS COPY CARRIES AND THE SHARED ONE DOES NOT: the two attribution
# trailers. They belong to git text rather than to prose, and the guard covers
# them under a separate rule of its own. A comparison should expect them here.

em-dash        | ro,en | "—"                      | em-dash
en-dash        | ro,en | "–"                      | en-dash
double-hyphen  | ro,en | " -- "                   | doua liniute
semicolon      | ro,en | ";"                      | punct si virgula
comma-and      | en    | ", and"                  | virgula inainte de and
comma-si       | ro    | ", și"                   | virgula inainte de si
comma-sau      | ro    | ", sau"                  | virgula inainte de sau
coauthor       | en    | "Co-Authored-By"         | footer de atribuire
generated-with | en    | "Generated with [Claude" | footer de atribuire
